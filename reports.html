<!DOCTYPE html><html lang="en"><head><title>Browse Reports – CampusFind</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script defer src="config.js"></script><script defer src="script.js"></script></head>
